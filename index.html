<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080B18">
    <meta name="description" content="A little universe, just for you — a cinematic birthday gift for Swaraa.">
    <meta name="robots" content="noindex">
    <title>For Swaraa · A Little Universe</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080B18'/%3E%3Ccircle cx='16' cy='13' r='5.5' fill='%23E8CB91'/%3E%3Cpath d='M7 25c3.5-4.5 14.5-4.5 18 0' fill='none' stroke='%23B6A7E8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <noscript><style>
        .reveal-item, [data-reveal] { opacity: 1 !important; transform: none !important; filter: none !important; }
        #particle-canvas { display: none; }
        .portrait-frame img { opacity: 1; }
    </style></noscript>
</head>
<body class="page-intro">

    <!-- cinematic background ------------------------------------------------ -->
    <div class="scene" aria-hidden="true">
        <div class="scene__stars scene__stars--far"></div>
        <div class="scene__stars"></div>
        <div class="scene__nebula"></div>
        <div class="scene__bokeh">
            <span class="bokeh bokeh--1"></span>
            <span class="bokeh bokeh--2"></span>
            <span class="bokeh bokeh--3"></span>
        </div>
        <div class="scene__vignette"></div>
        <div class="scene__grain"></div>
    </div>

    <!-- top navigation ------------------------------------------------------ -->
    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand__mark" aria-hidden="true"></span>
            <span class="brand__text">For Swaraa</span>
        </a>
        <nav class="topnav" aria-label="Primary">
            <a href="index.html" aria-current="page">Intro</a>
            <a href="pages/birthday.html">The Letter</a>
            <a href="pages/memories.html">Memories</a>
        </nav>
    </header>

    <!-- viewfinder frame ---------------------------------------------------- -->
    <div class="viewfinder" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
    </div>

    <!-- the stage ------------------------------------------------------------ -->
    <main class="stage">
        <canvas id="particle-canvas" aria-hidden="true"></canvas>

        <div class="hero">
            <div class="hero__visual">
                <div class="portrait-halo" aria-hidden="true"></div>

                <figure class="portrait-frame" id="portrait-frame">
                    <div class="portrait-loader" id="portrait-loader">
                        <span class="portrait-loader__ring" aria-hidden="true"></span>
                        <span class="portrait-loader__text">Gathering the light</span>
                    </div>
                    <img id="final-portrait" alt="Swarali" />
                    <div class="state-panel" id="portrait-state" hidden>
                        <p class="state-panel__title">The portrait stayed in the dark</p>
                        <p class="state-panel__text">We could not read the photograph, so the universe opened without it.</p>
                        <button class="state-panel__action" id="portrait-retry" type="button">Try again</button>
                    </div>
                </figure>
            </div>

            <div class="hero__copy" id="hero-copy">
                <p class="eyebrow reveal-item" style="--reveal-delay: 0ms">Chapter One</p>

                <h1 class="hero__title reveal-item" style="--reveal-delay: 140ms">
                    Happy Birthday
                    <em>Swaraa</em>
                </h1>

                <div class="hero__rule reveal-item" style="--reveal-delay: 280ms" aria-hidden="true"></div>

                <p class="hero__subtitle reveal-item" style="--reveal-delay: 380ms">
                    A little universe, just for you.
                </p>

                <div class="hero__actions reveal-item" style="--reveal-delay: 500ms">
                    <a class="btn btn--primary" href="pages/birthday.html">
                        Begin the celebration <span class="btn__arrow" aria-hidden="true">→</span>
                    </a>
                    <a class="btn btn--ghost" href="pages/memories.html">Our memories</a>
                </div>
            </div>
        </div>
    </main>

    <!-- reveal controls ------------------------------------------------------ -->
    <div class="intro-controls">
        <button class="control-chip" id="skip-animation" type="button" hidden>Skip the reveal</button>
        <span class="intro-credit">A gift for one person</span>
        <button class="control-chip" id="replay-particle" type="button" hidden>Replay portrait</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
